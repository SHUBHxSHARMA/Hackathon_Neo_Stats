# WorkNest local PostgreSQL. Database name stays neoboard to match server/.env.
services:
  postgres:
    image: postgres:17
    container_name: neoboard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neoboard
    ports:
      - "5432:5432"
    volumes:
      - neoboard_pg:/var/lib/postgresql/data

volumes:
  neoboard_pg:
